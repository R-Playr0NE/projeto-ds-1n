<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Produto</title>
    <link rel="icon" type="image/png" th:href="@{/image/empresa-icon.png}">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Meu CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="form-container">

        <h2 class="page-title">Cadastrar Produto</h2>

        <form class="system-form" th:action="@{/produtoCTR/salvarProduto}" method="post" th:object="${produto}">

            <input type="hidden" th:field="*{codigo_prod}" />

            <div class="form-group">
                <label>Nome:</label>
                <input type="text" th:field="*{nome_prod}" class="form-input" required>
            </div>

            <div class="form-group">
                <label>Valor:</label>
                <input type="number" step="0.01" th:field="*{perco_prod}" class="form-input" required>
            </div>

            <div class="form-group">
                <label>Empresa:</label>
                <select th:field="*{empresaID}" class="form-input" required>
                    <option value="">Selecione uma empresa</option>
                    <option th:each="emp : ${empresas}" th:value="${emp.id_empresa}" th:text="${emp.nome_empresa}">
                    </option>
                </select>
            </div>

            <div class="form-actions">

                <a th:href="@{/produtoCTR/listarAll}" class="btn-form btn-back">Voltar</a>

                <button type="submit" class="btn-form">Salvar</button>

            </div>

        </form>

    </div>

</body>

</html>
