<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Produto</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Meu CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h2>Cadastrar Produto</h2>

    <form th:action="@{/produtoCTR/salvarProduto}" method="post" th:object="${produto}">

        <input type="hidden" th:field="*{codigo_prod}" />

        <label>Nome:</label>
        <input type="text" th:field="*{nome_prod}" required><br>

        <label>Valor:</label>
        <input type="number" step="0.01" th:field="*{perco_prod}" required><br>

        <label>Empresa:</label>
        <select th:field="*{empresaID}" required>
            <option value="">Selecione uma empresa</option>
            <option th:each="emp : ${empresas}" th:value="${emp.id_empresa}" th:text="${emp.nome_empresa}">
            </option>
        </select>

        <a th:href="@{/produtoCTR/listarAll}">Voltar</a>

        <button type="submit">Salvar</button>

    </form>

</body>

</html>
