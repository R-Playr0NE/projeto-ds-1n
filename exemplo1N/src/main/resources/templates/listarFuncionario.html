<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bismarck Hub - Funcionários</title>
    <link rel="icon" type="image/png" th:href="@{/image/empresa-icon.png}">
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Meu CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body th:replace="~{fragments/layout :: layout('funcionarios', ~{::main})}">

    <main th:fragment="main">

        <h2 class="page-title">
            Lista de Funcionários
        </h2>

        <a class="btn-action" th:href="@{/funcionarioCTR/formCadastrar}">
            + Cadastrar Novo Funcionário
        </a>

        <!-- Responsividade da tabela -->
        <div class="table-responsive">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Salário</th>
                        <th>Empresa</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="func : ${funcionarios}">

                        <td th:text="${func.id_funcionario}">
                            001
                        </td>

                        <td th:text="${func.nome_funcionario}">
                            Nome do Funcionário
                        </td>

                        <td th:text="${func.cargo_funcionario}">
                            Cargo
                        </td>

                        <td th:text="${func.salario_funcionario}">
                            R$ 0,00
                        </td>

                        <td th:text="${func.empresaID.nome_empresa}">
                            Empresa
                        </td>

                        <td>

                            <a th:href="@{/funcionarioCTR/editarFunc/{id}(id=${func.id_funcionario})}">
                                [Editar]
                            </a>

                            <a th:href="@{/funcionarioCTR/deletarFunc/{id}(id=${func.id_funcionario})}"
                                onclick="return confirm('Deseja realmente excluir este funcionário?')">
                                [Excluir]
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
